name: Build Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy hls.js into the web bundle
        run: npm run prep

      - name: Create and patch the Android project
        run: npm run android:add

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk clearview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clearview-apk
          path: clearview.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest clearview.apk \
            --title "Clearview (latest build)" \
            --notes "Sideload on Fire TV with the Downloader app. Direct link: https://github.com/${{ github.repository }}/releases/download/latest/clearview.apk"
