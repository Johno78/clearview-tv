<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2fa8">
<title>Clearview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><i></i><b>clearview</b></div>
    <nav id="tabs"></nav>
    <div class="hsearch" id="hsearch"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg><input class="f" id="hs" type="text" placeholder="Search" autocomplete="off" autocapitalize="off"></div>
    <div id="clock"></div>
  </header>
  <main id="view"></main>
</div>

<div id="player" class="layer">
  <video id="video" playsinline></video>
  <div class="busy" id="busy"><i></i></div>
  <div class="p-info" id="pInfo"></div>
  <div class="p-bar" id="pBar"></div>
  <div class="p-err" id="pErr"></div>
  <aside class="drawer" id="drawer"></aside>
</div>

<div id="toast"></div>
<div id="boot"><div class="brand big"><i></i><b>clearview</b></div><p id="bootMsg">Starting…</p></div>

<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
