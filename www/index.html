<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Clearview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><i></i><b>clearview</b></div>
    <nav id="tabs"></nav>
    <div id="clock"></div>
  </header>
  <main id="view"></main>
</div>

<div id="player" class="layer">
  <video id="video" playsinline></video>
  <div class="busy" id="busy"><i></i></div>
  <div class="p-info" id="pInfo"></div>
  <div class="p-bar" id="pBar"></div>
  <div class="p-err" id="pErr"></div>
  <aside class="drawer" id="drawer"></aside>
</div>

<div id="toast"></div>
<div id="boot"><div class="brand big"><i></i><b>clearview</b></div><p id="bootMsg">Starting…</p></div>

<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
